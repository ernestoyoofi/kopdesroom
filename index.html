<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kopdesroom!</title>
  <link href="/src/style.css" rel="stylesheet">
</head>
<body>
  <div class="help-overlay">
    <h3>Welcome To Kopdes!</h3>
    <p class="info">For now, this game only support for Keyboard controller</p>
    <ul class="list-overlay">
      <li>Use <code>WASD</code> for walk</li>
      <li>Click <code>ESC</code> for unfocus cursor</li>
      <li>Use <code>Q</code> or <code>E</code> for peek</li>
      <li>Hold <code>Shift</code> + walk for run</li>
      <li>If you death, hit <code>Enter</code> to restart</li>
    </ul>
    <small>v0.8-Demo</small>
    <!-- <p class="bug-info"><small>Found bug? try refresh browser or <a href="https://github.com/ernestoyoofi/kopdesroom/issues" target="_blank">report issues</a></small></p> -->
  </div>
  <canvas id="gameCanvas"></canvas>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
